server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:400}
    accept-count: ${TOMCAT_ACCEPT_COUNT:200}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:10000}

spring:
  application:
    name: reports-service
  datasource:
    url: jdbc:postgresql://${REPORTS_DB_HOST:localhost}:${REPORTS_DB_PORT:5432}/${REPORTS_DB_NAME:reports_db}
    username: ${REPORTS_DB_USER:reports_user}
    password: ${REPORTS_DB_PASSWORD:isis2503}
    # Warm-cache reads hit Redis, so the DB pool stays small. 3 replicas *
    # 20 = 60 connections, under db.t3.micro's ~112 max_connections ceiling.
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
    mongodb:
      # Same MongoDB auth-service uses, for cross-company access evidence (ASR 2).
      uri: ${MONGO_URI:mongodb://localhost:27017/opticloud_auth}
  cache:
    type: redis
    redis:
      time-to-live: ${REPORTS_CACHE_TTL_MS:60000}
  jackson:
    serialization:
      write-dates-as-timestamps: false

opticloud:
  cache:
    queries: reports-queries
  jwt:
    # Must match auth-service JWT_SECRET so the company guard can verify tokens.
    secret: ${REPORTS_JWT_SECRET:change-me-in-prod}
  notification:
    base-url: ${NOTIFICATION_URL:http://localhost:8080/notifications}

management:
  endpoints:
    web:
      exposure:
        include: health,info,caches
