server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: normalization-service
  jackson:
    serialization:
      write-dates-as-timestamps: false

opticloud:
  reports:
    base-url: ${REPORTS_SERVICE_URL:http://localhost:8082/reports}
    timeout-ms: ${REPORTS_TIMEOUT_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
